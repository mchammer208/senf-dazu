name: Täglicher Post

on:
  schedule:
    # 16:30 und 17:30 UTC → einer davon ist immer 18:30 deutscher Zeit (Sommer- wie Winterzeit).
    # Das Skript postet nur ab 18 Uhr und nur einmal pro Tag.
    - cron: "30 16 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Sofort posten (Uhrzeit- und Tagesprüfung überspringen)"
        type: boolean
        default: false

concurrency:
  group: taeglicher-post
  cancel-in-progress: false

jobs:
  post:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot/daily.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          FORCE: ${{ inputs.force }}
